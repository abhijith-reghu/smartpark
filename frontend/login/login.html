<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartPark - Staff Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 24px;
            width: 300px;
            text-align: center;
        }
        h1 {
            color: #f1f5f9;
            font-size: 20px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #334155;
            border-radius: 20px;
            box-sizing: border-box;
            background-color: #1e293b;
            color: white;
            font-size: 14px;
        }
        input::placeholder {
            color: #64748b;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        #message {
            margin-top: 14px;
            font-size: 13px;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>SmartPark Staff Login</h1>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="message"></p>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            fetch("http://127.0.0.1:5000/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ username: username, password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "../staff-panel/index.html";
                } else {
                    document.getElementById("message").innerText = data.error;
                }
            })
            .catch(error => {
                document.getElementById("message").innerText = "Could not connect to server.";
            });
        }
    </script>

</body>
</html>
