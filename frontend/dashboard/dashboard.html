<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartPark - Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 30px;
            color: white;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #f1f5f9;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin: 8px 0 0;
            text-transform: uppercase;
        }
        .section-title {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 1px;
            margin: 20px 0 10px;
            text-transform: uppercase;
        }
        .section-card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-name {
            font-size: 16px;
            font-weight: bold;
        }
        .section-stats {
            font-size: 13px;
            color: #94a3b8;
        }
        .progress-bar {
            background-color: #334155;
            border-radius: 10px;
            height: 8px;
            width: 150px;
            overflow: hidden;
        }
        .progress-fill {
            background-color: #4ade80;
            height: 100%;
        }
        .dashboard-error {
            max-width: 800px;
            margin: 0 auto 18px;
            padding: 12px 16px;
            color: #fecaca;
            background: #450a0a;
            border: 1px solid #7f1d1d;
            border-radius: 10px;
        }
        @media (max-width: 640px) {
            body { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .section-card { gap: 12px; flex-wrap: wrap; }
            .progress-bar { width: 100px; }
        }
    </style>
</head>
<body>

    {% include 'navigation.html' %}

    <div class="header">
        <h1>SmartPark Admin Dashboard</h1>
        <p class="subtitle">Live parking statistics</p>
    </div>

    <p id="dashboardError" class="dashboard-error" role="alert" hidden></p>

    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>

        <p class="section-title">Section Breakdown</p>
        <div id="sectionBreakdown"></div>
    </div>

    <script>
        async function loadDashboard() {
            const errorBox = document.getElementById("dashboardError");

            try {
                const response = await fetch("/api/slots", {
                    cache: "no-store",
                    credentials: "same-origin"
                });

                if (response.status === 401) {
                    window.location.replace("/login");
                    return;
                }
                if (!response.ok) {
                    throw new Error("Could not load parking data. Please refresh.");
                }

                const data = await response.json();
                const slots = Array.isArray(data.slots) ? data.slots : [];
                errorBox.hidden = true;

            const total = slots.length;
            const available = slots.filter(s => s.status === "available").length;
            const occupied = total - available;
            const percent = total > 0 ? Math.round((occupied / total) * 100) : 0;

            document.getElementById("statsGrid").innerHTML = `
                <div class="stat-card">
                    <p class="stat-number">${total}</p>
                    <p class="stat-label">Total Slots</p>
                </div>
                <div class="stat-card">
                    <p class="stat-number" style="color:#4ade80;">${available}</p>
                    <p class="stat-label">Available</p>
                </div>
                <div class="stat-card">
                    <p class="stat-number" style="color:#f87171;">${occupied}</p>
                    <p class="stat-label">Occupied</p>
                </div>
                <div class="stat-card">
                    <p class="stat-number" style="color:#60a5fa;">${percent}%</p>
                    <p class="stat-label">Occupancy</p>
                </div>
            `;

            const sections = {};
            slots.forEach(slot => {
                if (!sections[slot.section]) {
                    sections[slot.section] = { total: 0, available: 0 };
                }
                sections[slot.section].total++;
                if (slot.status === "available") sections[slot.section].available++;
            });

            let breakdownHTML = "";
            for (const name in sections) {
                const sec = sections[name];
                const secPercent = Math.round((sec.available / sec.total) * 100);
                breakdownHTML += `
                    <div class="section-card">
                        <div>
                            <p class="section-name">Section ${name}</p>
                            <p class="section-stats">${sec.available} of ${sec.total} available</p>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${secPercent}%;"></div>
                        </div>
                    </div>
                `;
            }
                document.getElementById("sectionBreakdown").innerHTML =
                    breakdownHTML || "<p>No parking sections are configured.</p>";
            } catch (error) {
                errorBox.textContent = error.message || "Dashboard could not load.";
                errorBox.hidden = false;
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 3000);
    </script>

</body>
</html>
